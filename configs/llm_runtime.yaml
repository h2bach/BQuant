# BQuant local LLM runtime profile.
#
# Current host check on 2026-06-30:
# - GPU: NVIDIA RTX A4000
# - VRAM: 16GB total, ~15.9GB free during inspection
#
# v1 keeps deterministic/tool agents as the source of truth. The LLM is an
# optional narrator/orchestrator over structured agent outputs, not the only
# decision engine.

runtime:
  enabled: true
  backend: openai_compatible
  endpoint: http://127.0.0.1:8000/v1
  api_key_env: BQUANT_LLM_API_KEY
  default_model: Qwen/Qwen2.5-7B-Instruct-AWQ
  max_context_tokens: 8192
  max_new_tokens: 256
  temperature: 0.2
  timeout_seconds: 180
  fallback_to_deterministic: true
  disable_thinking: false

vllm_server:
  tmux_session: bquant_vllm
  conda_env: locpred_env
  model_id: Qwen/Qwen2.5-7B-Instruct-AWQ
  served_model_name: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq_marlin
  dtype: half
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  enforce_eager: true
  trust_remote_code: true
  hf_home: /storage/hhbach/hf_cache
  log_path: logs/observability/vllm/bquant_vllm.log

gpu_profile:
  name: NVIDIA RTX A4000
  total_vram_gb: 16
  recommended_concurrent_llms: 1
  notes: Keep one 7B/8B quantized model resident and run BQuant agents as tools.

candidate_models:
  primary:
    model_id: Qwen/Qwen2.5-7B-Instruct-AWQ
    role: live_chat_orchestrator
    quantization: AWQ 4-bit
    runtime: vllm
    reason: Upgraded on 2026-07-02 for stronger live chat and backtest decision quality while staying inside RTX A4000 VRAM.
  compact_fallback:
    model_id: Qwen/Qwen2.5-3B-Instruct
    role: low_vram_chat_orchestrator
    quantization: none_fp16
    runtime: vllm
    reason: Previous stable runtime; use if the 7B AWQ server fails to fit with the required context window.
  ollama_fallback_disabled:
    model_id: qwen3:8b
    role: local_chat_fallback
    runtime: local_ollama
    quantization: GGUF Q4_K_M
    reason: Available locally, but disabled for BQuant because it ran on CPU rather than GPU in the current host check.
  fallback_open:
    model_id: mistralai/Mistral-7B-Instruct-v0.3
    role: function_calling_chat
    quantization: external_awq_or_gptq_recommended
    reason: Apache-2.0 model with function-calling-oriented instruction tuning.
  gated_option:
    model_id: meta-llama/Llama-3.1-8B-Instruct
    role: long_context_chat
    quantization: external_awq_or_gptq_recommended
    reason: Strong 8B instruct model, but access/license gating must be handled.
