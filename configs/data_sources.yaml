# Data Sources Configuration for BQuant

# Legacy sources kept for fallback experiments only
vnquant:
  enabled: false
  name: vnquant
  type: historical_ohlcv
  description: Legacy daily source adapter
  package: vnquant

vnstock:
  enabled: true
  name: vnstock
  type: historical_ohlcv
  description: Canonical daily and intraday OHLCV source for Vietnam stocks and market indices via the VCI-data-source provider
  package: vnstock

  parameters:
    # `VCI` is the provider code expected by the vnstock API.
    # BQuant documentation refers to this provider as `VCI-data-source`
    # to avoid confusion with the VCI stock symbol.
    default_source: VCI
    default_source_label: VCI-data-source
    fallback_source: KBS
    daily_interval: d
    intraday_interval: 15m
    lookback_years: 10
    intraday_window_days: 60

  rate_limit:
    requests_per_minute: 15
    retry_attempts: 3
    retry_delay_seconds: 3

# Index data source (VNIndex, VN30)
index_data:
  enabled: true
  name: vnstock
  type: index
  description: Canonical market index OHLCV data for benchmarking via the VCI-data-source provider
  source: VCI
  source_label: VCI-data-source
  
  indices:
    - VNINDEX
    - VN30

# Universe data source
universe:
  enabled: true
  name: manual_config
  type: config_file
  description: Universe membership from configuration file
  config_file: configs/universe_vn30.yaml

# News data source (future)
news:
  enabled: false
  name: tbd
  type: news_feed
  description: News and reports for NLP features

# Realtime data source (future)
realtime:
  enabled: false
  name: tbd
  type: realtime_feed
  description: Realtime market data for intraday analysis
