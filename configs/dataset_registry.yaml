# Dataset Registry for BQuant
# All dataset paths must be registered here. Do not hard-code paths in code.

datasets:
  daily_ohlcv_10y:
    name: daily_ohlcv_10y
    description: Canonical 10-year daily OHLCV store for VN30 symbols
    parquet_path: data/base/daily_10y
    duckdb_table: daily_ohlcv_base
    layer: base
    format: parquet
    partition_by: []
    layout: one_file_per_symbol
    file_pattern: "{symbol}_{coverage_start}_curr.parquet"
    source: yfinance
    overwrite: true
    mode: replace_per_symbol

  intraday_ohlcv_15m_60d:
    name: intraday_ohlcv_15m_60d
    description: Canonical 60-day 15m intraday OHLCV snapshot for VN30 symbols
    parquet_path: data/base/intraday_15m_60d
    duckdb_table: intraday_ohlcv_15m_base
    layer: base
    format: parquet
    partition_by: []
    layout: one_file_per_symbol
    file_pattern: "{symbol}_intra60_{snapshot_date}.parquet"
    source: yfinance
    interval: 15m
    overwrite: true
    mode: replace_per_symbol

  intraday_ohlcv_15m_delta:
    name: intraday_ohlcv_15m_delta
    description: Separate 15m intraday delta file for post-snapshot updates
    parquet_path: data/base/intraday_15m_delta
    duckdb_table: intraday_ohlcv_15m_delta
    layer: base
    format: parquet
    partition_by: []
    layout: one_file_per_symbol
    file_pattern: "{symbol}_intra_delta_{snapshot_date}.parquet"
    source: yfinance
    interval: 15m
    overwrite: true
    mode: replace_per_symbol

  data_file_manifest:
    name: data_file_manifest
    description: Current coverage and freshness manifest for symbol parquet files
    parquet_path: data/metadata/data_file_manifest.parquet
    duckdb_table: data_file_manifest
    layer: metadata
    format: parquet
    partition_by: []
    source: system
    overwrite: true
    mode: replace

  # Raw layer
  raw_ohlcv:
    name: raw_ohlcv
    description: Raw OHLCV data from vnquant
    parquet_path: data/raw/ohlcv/source=vnquant
    duckdb_table: raw_ohlcv
    layer: raw
    format: parquet
    partition_by: [symbol]
    source: vnquant
    overwrite: false
    mode: append

  raw_ohlcv_hourly:
    name: raw_ohlcv_hourly
    description: Raw hourly OHLCV data from vnstock VCI source
    parquet_path: data/raw/ohlcv_1h/source=vnstock_vci
    duckdb_table: raw_ohlcv_hourly
    layer: raw
    format: parquet
    partition_by: [symbol]
    source: vnstock_vci
    overwrite: false
    mode: append
  
  # Silver layer
  clean_ohlcv_daily:
    name: clean_ohlcv_daily
    description: Cleaned and validated daily OHLCV data
    parquet_path: data/silver/clean_ohlcv_daily
    duckdb_table: clean_ohlcv_daily
    layer: silver
    format: parquet
    partition_by: []
    source: derived
    overwrite: true
    mode: replace

  clean_ohlcv_hourly:
    name: clean_ohlcv_hourly
    description: Cleaned and standardized hourly OHLCV data
    parquet_path: data/silver/clean_ohlcv_hourly
    duckdb_table: clean_ohlcv_hourly
    layer: silver
    format: parquet
    partition_by: []
    source: derived
    overwrite: true
    mode: replace
  
  universe_members:
    name: universe_members
    description: Universe membership configuration
    parquet_path: data/silver/universe_members
    duckdb_table: universe_members
    layer: silver
    format: parquet
    partition_by: []
    source: config
    overwrite: true
    mode: replace
  
  # Gold layer
  technical_features_daily:
    name: technical_features_daily
    description: Technical indicators and features
    parquet_path: data/gold/technical_features_daily
    duckdb_table: technical_features_daily
    layer: gold
    format: parquet
    partition_by: []
    source: derived
    overwrite: true
    mode: replace
  
  combined_features_daily:
    name: combined_features_daily
    description: Combined features with scores and targets
    parquet_path: data/gold/combined_features_daily
    duckdb_table: combined_features_daily
    layer: gold
    format: parquet
    partition_by: []
    source: derived
    overwrite: true
    mode: replace
  
  # Marts layer
  trading_signals:
    name: trading_signals
    description: Daily trading signals for consumption
    parquet_path: data/marts/trading_signals
    duckdb_table: trading_signals
    layer: marts
    format: parquet
    partition_by: []
    source: derived
    overwrite: true
    mode: replace
  
  backtest_results:
    name: backtest_results
    description: Backtest run results
    parquet_path: data/marts/backtest_results
    duckdb_table: backtest_runs
    layer: marts
    format: parquet
    partition_by: []
    source: derived
    overwrite: true
    mode: append

# DuckDB database configuration
duckdb:
  path: warehouse/bquant.duckdb
  read_only: false

# Data lineage
lineage:
  daily_ohlcv_10y:
    inputs: []
    outputs: [technical_features_daily, data_file_manifest]

  intraday_ohlcv_15m_60d:
    inputs: []
    outputs: [intraday_ohlcv_15m_delta, data_file_manifest]

  intraday_ohlcv_15m_delta:
    inputs: [intraday_ohlcv_15m_60d]
    outputs: [data_file_manifest]

  data_file_manifest:
    inputs: [daily_ohlcv_10y, intraday_ohlcv_15m_60d, intraday_ohlcv_15m_delta]
    outputs: []

  raw_ohlcv:
    inputs: []
    outputs: [clean_ohlcv_daily]

  raw_ohlcv_hourly:
    inputs: []
    outputs: [clean_ohlcv_hourly]
  
  clean_ohlcv_daily:
    inputs: [raw_ohlcv]
    outputs: [technical_features_daily]

  clean_ohlcv_hourly:
    inputs: [raw_ohlcv_hourly]
    outputs: []
  
  universe_members:
    inputs: []
    outputs: [technical_features_daily, combined_features_daily]
  
  technical_features_daily:
    inputs: [clean_ohlcv_daily]
    outputs: [combined_features_daily]
  
  combined_features_daily:
    inputs: [technical_features_daily, universe_members]
    outputs: [trading_signals]
  
  trading_signals:
    inputs: [combined_features_daily]
    outputs: []
  
  backtest_results:
    inputs: [combined_features_daily, trading_signals]
    outputs: []

# Dataset metadata
metadata:
  system: BQuant
  version: 0.1.0
  registry_version: 1.0
  last_updated: "2026-06-08"
