# BQuant QAOA portfolio optimizer configuration.

backend: qiskit_aer_simulator
optimizer: COBYLA
qaoa_reps: 1
max_iterations: 60
candidate_pool_size: 12
max_positions: 8
max_qiskit_qubits: 8
risk_aversion: 0.65
turnover_penalty: 0.10
concentration_penalty: 0.15
bad_quality_penalty: 0.40
min_liquidity_percentile: 0.25
max_symbol_weight: 0.15
min_cash_weight: 0.05
fallback_solver: classical_bruteforce_or_greedy
lookback_days: 252
random_seed: 42
